# Databricks Asset Bundle: deploys the lab's notebooks as a job and the declarative pipeline.
#   databricks bundle validate
#   databricks bundle deploy -t dev --var catalog=<your_catalog>
#   databricks bundle run lab_notebooks -t dev
#   databricks bundle run medallion_pipeline -t dev
bundle:
  name: lakehouse_modeling_lab

variables:
  catalog:
    description: Unity Catalog catalog to create the lab schemas in
    default: main

resources:
  jobs:
    lab_notebooks:
      name: lakehouse-modeling-lab-notebooks
      description: Bronze → Silver → Gold star schema and Raw/Business Vault, then validation.
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ./notebooks/00_setup.py
        - task_key: bronze
          depends_on: [{ task_key: setup }]
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingest.py
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task:
            notebook_path: ./notebooks/02_silver_conform.sql
        - task_key: gold_star_schema
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ./notebooks/03_gold_star_schema.sql
        - task_key: raw_vault
          depends_on: [{ task_key: bronze }]
          notebook_task:
            notebook_path: ./notebooks/04_raw_vault.py
        - task_key: business_vault
          depends_on: [{ task_key: raw_vault }]
          notebook_task:
            notebook_path: ./notebooks/05_business_vault.sql
        - task_key: validate
          depends_on: [{ task_key: gold_star_schema }, { task_key: business_vault }]
          notebook_task:
            notebook_path: ./notebooks/06_validate.sql

  pipelines:
    medallion_pipeline:
      name: lakehouse-modeling-lab-declarative
      catalog: ${var.catalog}
      schema: stagedoor_ldp
      serverless: true
      configuration:
        landing_path: /Volumes/${var.catalog}/stagedoor_landing/files/raw
      libraries:
        - file:
            path: ./pipelines/medallion_pipeline.sql

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
